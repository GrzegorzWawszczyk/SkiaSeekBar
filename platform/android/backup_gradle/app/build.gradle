apply plugin: 'com.android.application'

android {
    namespace "com.example.app"
    compileSdk 33

    defaultConfig {
        applicationId "com.example.app"
        minSdk 28
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}
